name: Integration Tests

on:
  pull_request:
    types: [ review_requested, ready_for_review, synchronize ]
  workflow_dispatch:

# Pull requests group by pr-<number>. Manual runs group by ref.
# A newer run cancels the in-progress run in the same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Manual runs always build. Pull requests build only when not a draft.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with Integration Tests
        run: |
          if [ -f /.dockerenv ]; then
            # act runs this step inside a container. Ryuk's published port is on the Docker host.
            export TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal
          fi
          ./gradlew --console=plain --warning-mode=all clean integrationTest
