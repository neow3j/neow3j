plugins {
    id "de.undercouch.download" version "4.1.2"
}

description 'neow3j: Integration Tests'

dependencies {
    testImplementation project(':compiler'),
            project(':contract'),
            project(':devpack'),
            project(':devpack-test'),
            project(':test-tools'),
            "org.testcontainers:testcontainers-junit-jupiter:$testcontainersVersion"
}

tasks.named('integrationTest', Test) {
    // Log individual test results as they complete for CI visibility.
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}
